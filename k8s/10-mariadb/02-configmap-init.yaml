apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-init-r-27-11-2026
  namespace: ecommerce-r-27-11-2026
  labels: {app: mariadb-r-27-11-2026, tier: database}
data:
  init-databases.sh: |
    #!/bin/bash
    # Exécuté une seule fois, au premier démarrage (volume vide)
    set -e
    mariadb -uroot -p"${MARIADB_ROOT_PASSWORD}" <<EOSQL
    CREATE DATABASE IF NOT EXISTS \`${SHOP_DB_NAME}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE USER IF NOT EXISTS '${SHOP_DB_USER}'@'%' IDENTIFIED BY '${SHOP_DB_PASSWORD}';
    GRANT ALL PRIVILEGES ON \`${SHOP_DB_NAME}\`.* TO '${SHOP_DB_USER}'@'%';
    CREATE DATABASE IF NOT EXISTS \`${BACKOFFICE_DB_NAME}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE USER IF NOT EXISTS '${BACKOFFICE_DB_USER}'@'%' IDENTIFIED BY '${BACKOFFICE_DB_PASSWORD}';
    GRANT ALL PRIVILEGES ON \`${BACKOFFICE_DB_NAME}\`.* TO '${BACKOFFICE_DB_USER}'@'%';
    FLUSH PRIVILEGES;
    EOSQL
