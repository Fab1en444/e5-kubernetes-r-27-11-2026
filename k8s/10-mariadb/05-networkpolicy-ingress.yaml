apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-ingress-r-27-11-2026
  namespace: ecommerce-r-27-11-2026
spec:
  podSelector:
    matchLabels: {app: mariadb-r-27-11-2026}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {acces-mariadb: "true"}
    ports:
    - {protocol: TCP, port: 3306}
