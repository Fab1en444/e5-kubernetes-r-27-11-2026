  namespace: ecommerce-r-27-11-2026
spec:
  podSelector:
    matchLabels: {acces-mariadb: "true"}
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels: {app: mariadb-r-27-11-2026}
    ports:
    - {protocol: TCP, port: 3306}
