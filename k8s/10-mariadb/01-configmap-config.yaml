apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-config-r-27-11-2026
  namespace: ecommerce-r-27-11-2026
  labels: {app: mariadb-r-27-11-2026, tier: database}
data:
  custom-r-27-11-2026.cnf: |
    [mysqld]
    innodb_buffer_pool_size = 96M
    max_connections = 60
    performance_schema = OFF
    skip-name-resolve
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_ci
