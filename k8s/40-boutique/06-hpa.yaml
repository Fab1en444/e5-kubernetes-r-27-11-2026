apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: boutique-hpa-r-27-11-2026
  namespace: ecommerce-r-27-11-2026
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: boutique-r-27-11-2026
  minReplicas: 3
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
