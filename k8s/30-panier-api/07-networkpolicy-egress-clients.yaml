apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: panier-api-clients-egress-r-27-11-2026
  namespace: ecommerce-r-27-11-2026
spec:
  podSelector:
    matchLabels: {acces-panier-api: "true"}
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels: {app: panier-api-r-27-11-2026}
    ports:
    - {protocol: TCP, port: 8000}
