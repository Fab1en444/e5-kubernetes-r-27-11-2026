apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: panier-api-ingress-r-27-11-2026
  namespace: ecommerce-r-27-11-2026
spec:
  podSelector:
    matchLabels: {app: panier-api-r-27-11-2026}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {acces-panier-api: "true"}
    ports:
    - {protocol: TCP, port: 8000}
