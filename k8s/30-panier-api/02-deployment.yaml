apiVersion: apps/v1
kind: Deployment
metadata:
  name: panier-api-r-27-11-2026
  namespace: ecommerce-r-27-11-2026
  labels: {app: panier-api-r-27-11-2026, tier: api}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: panier-api-r-27-11-2026}
  template:
    metadata:
      labels:
        app: panier-api-r-27-11-2026
        tier: api
        acces-redis: "true"
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: panier-api
        image: localhost:5000/panier-api-r-27-11-2026:1.0
        ports:
        - {name: http, containerPort: 8000}
        envFrom:
        - configMapRef: {name: panier-api-config-r-27-11-2026}
        env:
        - name: REDIS_PASSWORD
          valueFrom: {secretKeyRef: {name: redis-secret-r-27-11-2026, key: REDIS_PASSWORD}}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        startupProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 3
          failureThreshold: 20
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 20
        lifecycle:
          preStop:
            exec: {command: ["sleep", "5"]}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 300m, memory: 160Mi}
